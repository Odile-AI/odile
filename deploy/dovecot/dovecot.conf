# Dovecot — the support mailbox's IMAP half — source of truth: deploy/dovecot/dovecot.conf
#
# One listener: IMAPS on 993. Port 143 is not filtered but *disabled* — there is
# no plaintext IMAP socket at all — and auth_allow_cleartext = no refuses a
# plaintext AUTH even if a listener is ever added by hand. The certificate is the
# one Postfix already serves (CN=mail.odile.fyi), which this host's CA store
# trusts and a tenant pins as `mail_relay.tls_ca`.
#
# The mailbox is read where Postfix delivers it, not copied: the Maildir at
# /var/mail/help/Maildir, owned by the `help` user, is the storage. Opening it
# with IMAP performs the normal Maildir \Recent transition (new/ -> cur/, a
# rename with a ":2," flag suffix); it moves no message out of the Maildir and
# rewrites none.
#
# One credential store serves both protocols. /etc/dovecot/users (0600 root) is
# a passwd-file of {SHA512-CRYPT} hashes, one line per account: the mailbox
# login help@odile.fyi, the submission-only test account
# odile-test@mail.odile.fyi, and one <name>@mail.odile.fyi line per tenant
# (`apply.py --set-account-password`). Postfix smtpd on
# 587 asks this auth service over /var/spool/postfix/private/auth, so submission
# is hash-only too. The Cyrus store this replaces (/etc/sasldb2) held the
# password in the clear because PLAIN/LOGIN authenticates against it; it is gone.
#
# /etc/dovecot/userdb (also 0600 root) is derived from those lines and holds
# only help@odile.fyi. Postfix's SMTP AUTH does a passdb lookup and no userdb
# lookup (its request carries `nologin`), so odile-test authenticates on 587 but
# cannot complete an IMAP login: the userdb step fails. A tenant-held submission
# secret therefore cannot read the support Maildir.
#
# The one plaintext copy of the mailbox password lives in
# /root/.odile/mailbox-help-password.txt (0600 root), written by
# `apply.py --set-password` for the handover; this repository never sees it.
#
# Dovecot 2.4 names the old `mail_location = maildir:/var/mail/help/Maildir`
# as mail_driver + mail_path (same location, same files); ssl_cert/ssl_key are
# ssl_server.cert_file/key_file. The 2.3 spellings are rejected by doveconf.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
listen = *, ::

# TLS only, on the same certificate submission already uses.
ssl = required
ssl_server_cert_file = /etc/ssl/certs/mail.odile.fyi.crt
ssl_server_key_file = /etc/ssl/private/mail.odile.fyi.key
ssl_min_protocol = TLSv1.2

auth_mechanisms = plain login
auth_allow_cleartext = no

# The realm Postfix already used: smtpd_sasl_local_domain defaults to
# myhostname, so a client that sends bare `odile-test` (scripts/send_test.py)
# resolved to odile-test@mail.odile.fyi under Cyrus and must keep resolving the
# same way here. Thunderbird sends the full address, so help@odile.fyi is
# unaffected.
auth_default_domain = mail.odile.fyi

# The existing Maildir, read in place.
mail_driver = maildir
mail_path = /var/mail/help/Maildir
mail_home = /var/mail/help
mail_uid = help
mail_gid = help

# One hash per account, no plaintext fallback: an entry without a {SCHEME}
# prefix is read as SHA512-CRYPT, so a bare password in the file fails closed.
# use_worker runs the lookup in auth-worker (root), which is what lets the file
# stay 0600 root:root instead of group-readable by the dovecot auth process.
#
# The deny passdb runs first. imap-login asks for deny.imap, which names the
# submission-only account, so an IMAP login by that account gets a clean
# AUTHENTICATIONFAILED before the real passdb is consulted; Postfix's AUTH
# request carries service=smtp and reads the empty deny.smtp, so the same
# account authenticates on 587. The userdb file is a second layer: it holds
# only help@odile.fyi, so even a passdb miss cannot resolve a mailbox for the
# tenant account.
passdb deny {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/deny.%{protocol}
  deny = yes
  use_worker = yes
}
passdb users {
  driver = passwd-file
  default_password_scheme = SHA512-CRYPT
  passwd_file_path = /etc/dovecot/users
  use_worker = yes
}
userdb users {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/userdb
  use_worker = yes
}

# Postfix smtpd on 587. The socket sits in Postfix's private queue directory
# and is 0660 postfix:postfix, so only the postfix uid can reach it; Postfix
# then hands the AUTH exchange to this auth service instead of keeping a second
# credential store of its own.
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

service imap-login {
  # port 0 removes the plaintext listener; it is not a firewall rule.
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
