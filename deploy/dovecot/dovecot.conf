# Dovecot — the support mailbox's IMAP half — source of truth: deploy/dovecot/dovecot.conf
#
# One listener: IMAPS on 993. Port 143 is not filtered but *disabled* — there is
# no plaintext IMAP socket at all — and auth_allow_cleartext = no refuses a
# plaintext AUTH even if a listener is ever added by hand. The certificate is the
# one Postfix already serves (CN=mail.odile.fyi), which this host's CA store
# trusts and a tenant pins as `mail_relay.tls_ca`.
#
# The mailbox is read where Postfix delivers it, not copied: the Maildir at
# /var/mail/help/Maildir, owned by the `help` user, is the storage. Opening it
# with IMAP performs the normal Maildir \Recent transition (new/ -> cur/, a
# rename with a ":2," flag suffix); it moves no message out of the Maildir and
# rewrites none.
#
# The one account is a single passwd-file entry in /etc/dovecot/users (0600
# root) holding a {SHA512-CRYPT} hash. The one plaintext copy lives in
# /root/.odile/mailbox-help-password.txt (0600 root), written by
# `apply.py --set-password` for the handover; this repository never sees it.
#
# Dovecot 2.4 names the old `mail_location = maildir:/var/mail/help/Maildir`
# as mail_driver + mail_path (same location, same files); ssl_cert/ssl_key are
# ssl_server.cert_file/key_file. The 2.3 spellings are rejected by doveconf.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
listen = *, ::

# TLS only, on the same certificate submission already uses.
ssl = required
ssl_server_cert_file = /etc/ssl/certs/mail.odile.fyi.crt
ssl_server_key_file = /etc/ssl/private/mail.odile.fyi.key
ssl_min_protocol = TLSv1.2

auth_mechanisms = plain login
auth_allow_cleartext = no

# The existing Maildir, read in place.
mail_driver = maildir
mail_path = /var/mail/help/Maildir
mail_home = /var/mail/help
mail_uid = help
mail_gid = help

# One account, one hash, no plaintext fallback: an entry without a {SCHEME}
# prefix is read as SHA512-CRYPT, so a bare password in the file fails closed.
# use_worker runs the lookup in auth-worker (root), which is what lets the file
# stay 0600 root:root instead of group-readable by the dovecot auth process.
passdb passwd-file {
  default_password_scheme = SHA512-CRYPT
  passwd_file_path = /etc/dovecot/users
  use_worker = yes
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  use_worker = yes
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

service imap-login {
  # port 0 removes the plaintext listener; it is not a firewall rule.
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
