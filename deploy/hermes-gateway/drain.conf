# A planned gateway stop must outlast the 300 s drain.
#
# t_0284f0cf, from the 17 November inference-spend audit §3.1: 86 workers died
# without finishing, 27 of them within seven minutes of a logged gateway stop,
# and 36 exited 130 (SIGINT — the interrupt a shutdown sends). dmesg shows no
# OOM kill. The restart is the killer.
#
# `agent.restart_drain_timeout` is 300 s (config.yaml). The gateway sizes its
# own stop envelope at drain + 30 s = 330 s, but the unit file ships
# `TimeoutStopSec=70`, so systemd would SIGKILL the drain halfway. This drop-in
# is the matching bump: 420 s leaves the gateway's 330 s envelope plus teardown.
#
# A drop-in, not an edit to the unit: the unit is Hermes-managed and is
# rewritten by `hermes` updates; a `.d` file survives that (same reason as
# deploy/hermes-gateway/oom.conf). Install and verify:
#
#   install -D -m 0644 deploy/hermes-gateway/drain.conf \
#     /root/.config/systemd/user/hermes-gateway.service.d/drain.conf
#   systemctl --user daemon-reload
#   systemctl --user show hermes-gateway -p TimeoutStopUSec   # TimeoutStopUSec=7min
#
# The config value and this drop-in take effect at the next restart, and
# `tools/restart_window.py` is the restart path that decides when that is.
[Service]
TimeoutStopSec=420
