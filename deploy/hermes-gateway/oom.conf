# ODL-335: a child OOM must not take the gateway and every worker with it.
#
# systemd's default OOMPolicy=stop stops the whole unit when any process in its
# cgroup is killed by the OOM killer. On 2026-11-12 that happened three times
# (19:30:58, 20:10:40, 20:47:30, each a qemu-system-x86 guest inside this
# unit's cgroup), and each stop killed every managed worker and restarted the
# gateway — 20 crashed runs. continue means the kernel's choice stands and the
# unit keeps running: the guest dies, the seats survive.
#
# A drop-in, not an edit to the unit: the unit is Hermes-managed and is
# rewritten by `hermes` updates. See docs/ops/DISK-CARE.md.
[Service]
OOMPolicy=continue
