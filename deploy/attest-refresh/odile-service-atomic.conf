# Boot-time write, same temp-and-rename path as the five-minute timer.
# The empty assignment clears odile.service's own ExecStartPre; the wrapper
# calls the same /opt/odile/attest.py, so /attestation is never half-written.
[Service]
ExecStartPre=
ExecStartPre=+/opt/odile/deploy/attest-refresh/refresh.sh
