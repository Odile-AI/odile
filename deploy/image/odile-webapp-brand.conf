# ODL-503 follow-up: the backstop for the update flow.
#
# `hermes update` rebuilds the Webapp and then restarts the gateway ("A
# previous `hermes update` pulled new code but did not restart running
# gateways." — journalctl, 2026-11-14 01:27:12Z). The path unit catches the
# rebuild itself; this ExecStartPre catches the same bundle on every later
# gateway start, so a missed inotify event is repaired before the page answers.
#
# It is a drop-in, not an edit to odile-agent.service: the release installer
# writes that unit file on its first run (and on --force) and would drop an
# ExecStartPre written into it. The helper exits 0 on every runtime condition,
# so it can never keep the gateway down; --quiet keeps a converged start out
# of the journal.
[Service]
ExecStartPre=/usr/bin/python3 /usr/local/lib/odile/odile-webapp-brand.py --home __TENANT_HOME__ --quiet
