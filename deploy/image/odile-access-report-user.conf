# The release installer writes odile-access-report.service itself (its own
# template, no Environment= line) and its wrapper then looks up the user
# `odile`. This image's tenant account is `tenant`, so the report would fail
# with "no /home/odile/.hermes/.env" and the release install would stop at the
# unit restart (measured on ODL-332 round 6).
#
# A drop-in survives the installer's rewrite: it writes the unit file, not this
# directory, and systemd merges every /etc/systemd/system/<unit>.d/*.conf when
# it loads the unit. install-stack.sh installs this file; the release's own
# unit keeps its ExecStart, sandbox and ordering.
[Service]
Environment=ODILE_ACCESS_USER=tenant
