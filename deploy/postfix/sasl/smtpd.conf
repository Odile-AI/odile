# Cyrus SASL configuration for Postfix smtpd — source of truth:
# deploy/postfix/sasl/smtpd.conf. Reached through cyrus_sasl_config_path.
#
# Accounts live in /etc/sasldb2 (Berkeley DB, mode 0640, group postfix) and
# are created with saslpasswd2 — never committed. Only PLAIN and LOGIN are
# offered, and smtpd_tls_auth_only means they are only offered after STARTTLS.
pwcheck_method: auxprop
auxprop_plugin: sasldb
mech_list: plain login
