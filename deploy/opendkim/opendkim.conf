# /etc/opendkim.conf — Odile mail signing
#
# Source of truth: deploy/opendkim/opendkim.conf. Apply with
# ./deploy/opendkim/apply.py --apply and prove with --check.
Syslog            yes
SyslogSuccess     yes
LogWhy            yes

UMask             007
UserID            opendkim:postfix
Socket            local:/var/spool/postfix/opendkim/opendkim.sock
PidFile           /run/opendkim/opendkim.pid

Canonicalization  relaxed/relaxed
Mode              sv
SubDomains        yes
SignatureAlgorithm rsa-sha256
OversignHeaders   From
DNSTimeout        5

KeyTable          /etc/dkimkeys/KeyTable
SigningTable      refile:/etc/dkimkeys/SigningTable
ExternalIgnoreList refile:/etc/dkimkeys/TrustedHosts
InternalHosts     refile:/etc/dkimkeys/TrustedHosts

AutoRestart       yes
AutoRestartRate   10/1h
Background        yes
