# The gate — every push and pull request to main runs the commands a developer
# runs before a commit. A red run means a broken tree, not a missing runner.
#
# Five jobs, one per surface:
#   check            make check — prereqs, tree secret scan, publication scan,
#                    tests, the installer's self-test, compile, shellcheck,
#                    claims, brand, roadmap
#   fresh-check      clone HEAD and run the same gate inside the clone
#   demo-check       the local demo's headless acceptance run, no network
#   publish-lint     the publication gate over the built tree. On a pull
#                    request the BASE branch's leak_scan and allowlist run over
#                    this tree, then the tree's own scanner — a PR cannot widen
#                    its own gate. On a push to main the tree's own scanner and
#                    allowlist run: main is the merged result, already gated as
#                    a PR, and the rows a merge adds are exactly the rows the
#                    pre-push main lacks. The deny list is the LEAK_FORBID_B64
#                    secret, so no checkout can edit it.
#   history-secrets  scan every commit, not the one-commit shallow default,
#                    and run the deny list over every blob (--forbid-only):
#                    an address or account id in an old root is a leak even
#                    when the head's tree is clean. Same base-on-a-PR,
#                    tree-on-a-push rule as publish-lint.
#
# This file is a shipped path in the repository, and the repository is the
# source of truth: the copy these five jobs run is the one in the tree at the
# pushed head. An edit made here reaches it as an ordinary commit on `main` or
# on a card branch that is merged; never as a replacement root.
#
# The roadmap check is not a job. tools/roadmap_page.py and docs/backlog.yaml
# are private, so a runner on the public tree cannot render the page; the check
# lives in `make check` on HQ (two renders at one --now, byte-identical, no
# unfilled slot) and the target skips itself where the private inputs are absent.
#
# The host. The runner is ubuntu-24.04, but the gate runs inside a pinned
# Ubuntu 26.04 container — the release HQ runs (26.04.1: OpenSSL 3.5.5,
# cryptsetup 2.8.4, Python 3.14.4) — because the tree's scripts and tests
# assume this host: OpenSSL 3.5 for `openssl dgst -sign` with an Ed25519 key
# (3.0 refuses it), cryptsetup 2.8's re-encryption resume semantics, root for
# the loop-mount builds, the `odile` service user, and
# postfix/caddy/restic/debootstrap for the tests that drive them. On a bare
# ubuntu-24.04 runner 146 tests fail on those host assumptions alone; in a
# Debian 13 container the interrupted-rekey test fails because cryptsetup 2.7.5
# cannot finish the state 2.8.4 leaves. The image is pinned by digest;
# `--privileged` is for the build test that re-execs under
# `unshare -m --propagation private`.
#
# The compiler. Two classes in tests/test_sealed_image.py — FirstBootReKeyTests
# (4 tests) and SnpreportTests (8) — skip when `gcc` is absent, so the first
# green run of this workflow printed `Ran 1627 tests ... OK (skipped=8)` while a
# break in the LUKS re-key or the SNP report would have passed. `build-essential`
# is in both toolchain installs, so the gate runs those 12 tests instead of
# skipping them. In the pinned container the published tree measures `Ran 1215
# tests`, `OK (skipped=2)` — the Hermes checkout and the HQ Maildir are absent
# there, and HQ runs those two; round 2 measured `Ran 1648 tests`,
# `OK (skipped=6)` on the tree published then.
#
# The bench probe's prerequisite. `scripts/check_bench.sh --probe` names the pid
# and command holding the bench's port with `ss`, and exits 2 when `ss` is
# absent — it is in the probe's prerequisite list beside curl and mktemp. `ss`
# is iproute2; `procps` does not carry it. In this container the four ProbeTests
# in tests/test_bench_probe.py therefore failed on the missing prerequisite, not
# on the probe (run 45095519414, 2026-11-23: `AssertionError: 2 != 0 :
# prerequisite: ss is not installed`, `FAILED (failures=4)`, in both `check` and
# `fresh-check`). Both toolchain installs add iproute2, so the probe runs rather
# than exiting 2.
#
# The SSH prerequisites. `make check`'s prereqs also names the three OpenSSH
# binaries the Hetzner pair's key install shells out to: `ssh-keygen` and
# `ssh-keyscan` pin the host key, and `sshpass` hands the one-time password to
# `ssh` through a 0600 file (`odilectl/provision.py`, ODL-924 review 1). Both
# toolchain installs carry `openssh-client` — which is `ssh`, `ssh-keygen` and
# `ssh-keyscan` — and `sshpass`, a separate package. Without it the gate stops
# in `prereqs` before one test runs (run 45762410714, 2026-11-26: `check` and
# `fresh-check` both red in 6 s at `Makefile:165`, `make check: sshpass is not
# installed`). HQ had the binary, so every local gate was green and only CI was
# red. A prereq added to `prereqs` belongs in both apt lists here in the same
# change.
#
# The seed identity's prerequisite. `tests/test_seed.py`'s BackupPairs (ODL-924)
# calls `build_seed` with no explicit identity, so `seed_identity()` reads the
# host's seed key and the committed certificate over it. HQ has
# /root/.odile/seed-signing.pem; a runner does not, and with `sshpass` fixed the
# run failed there instead (`signing key /root/.odile/seed-signing.pem: [Errno 2]
# No such file or directory` — run 45773205870, `Ran 2741 tests ... errors=1`).
# Both jobs therefore mint a throwaway chain for the run — a seed key, a release
# key (the verb refuses one under /root) and the certificate over the seed
# public key — and pass it to the gate through ODILE_SEED_SIGNING_KEY,
# ODILE_SEED_CERT and ODILE_SEED_RELEASE_PUBKEY. No secret is in this file: the
# key exists only for the lifetime of the job. The seed key's real public half
# is committed at deploy/seed/seed-key.pub, but `openssl pkey -pubout` reads a
# private PEM, so the runner mints its own pair rather than restoring that one.
#
# There is no secret in this file, no job writes to the repository, every action
# is pinned to a full commit SHA (the comment names the release), the base image
# is pinned by digest, and the shellcheck binary by SHA-256. The checkout is
# credential-free; see docs/ops/PUBLISH-REMOTE.md.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96
      options: --privileged
    steps:
      - name: Install the gate's toolchain
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -y -qq git python3 python3-yaml openssl ca-certificates procps iproute2 debconf sudo make build-essential systemd fdisk e2fsprogs curl xz-utils
          echo "postfix postfix/main_mailer_type select Internet Site" | debconf-set-selections
          echo "postfix postfix/mailname string ci.invalid" | debconf-set-selections
          apt-get -o Acquire::Retries=3 install -y -qq restic caddy postfix debootstrap cryptsetup squashfs-tools qemu-utils ovmf openssh-client sshpass gnupg rsync sqlite3 jq
          curl -fsSL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          id -u odile >/dev/null 2>&1 || useradd --system --user-group --create-home --home-dir /home/odile --shell /usr/sbin/nologin odile
          echo "gate host: $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release) | $(openssl version) | $(python3 --version) | shellcheck $(shellcheck --version | sed -n 's/^version: //p')"
      - name: Check out the tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # The checkout is written by the runner's user and read by root inside the
      # container, which git refuses as "dubious ownership" without this.
      - name: Trust this checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Mint the gate's throwaway seed identity
        run: |
          set -euo pipefail
          /usr/bin/python3 seed/seed.py keygen --out /root/.odile/seed-signing.pem --force
          /usr/bin/python3 seed/seed.py keygen --out /var/tmp/odile-ci-release-key.pem --force
          /usr/bin/python3 seed/seed.py seed-cert \
            --file /root/.odile/seed-signing.pem.pub \
            --key /var/tmp/odile-ci-release-key.pem \
            --out /var/tmp/odile-ci-seed.crt
      - name: make check
        env:
          ODILE_SEED_SIGNING_KEY: /root/.odile/seed-signing.pem
          ODILE_SEED_CERT: /var/tmp/odile-ci-seed.crt
          ODILE_SEED_RELEASE_PUBKEY: /var/tmp/odile-ci-release-key.pem.pub
        run: make check

  fresh-check:
    name: fresh-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96
      options: --privileged
    steps:
      - name: Install the gate's toolchain
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -y -qq git python3 python3-yaml openssl ca-certificates procps iproute2 debconf sudo make build-essential systemd fdisk e2fsprogs curl xz-utils
          echo "postfix postfix/main_mailer_type select Internet Site" | debconf-set-selections
          echo "postfix postfix/mailname string ci.invalid" | debconf-set-selections
          apt-get -o Acquire::Retries=3 install -y -qq restic caddy postfix debootstrap cryptsetup squashfs-tools qemu-utils ovmf openssh-client sshpass gnupg rsync sqlite3 jq
          curl -fsSL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          id -u odile >/dev/null 2>&1 || useradd --system --user-group --create-home --home-dir /home/odile --shell /usr/sbin/nologin odile
          echo "gate host: $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release) | $(openssl version) | $(python3 --version) | shellcheck $(shellcheck --version | sed -n 's/^version: //p')"
      - name: Check out the tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # The checkout is written by the runner's user and read by root inside the
      # container, which git refuses as "dubious ownership" without this.
      - name: Trust this checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # actions/checkout leaves a pull_request run on a detached merge commit.
      # make fresh-check clones HEAD, and a clone of a detached commit with no
      # branch pointing at it has an unborn HEAD and no tree, so make the
      # checkout clonable first. On a push to main this is a no-op.
      - name: Make HEAD a branch so the fresh clone has a tree
        run: |
          set -euo pipefail
          git checkout --quiet -B main HEAD
          echo "fresh-check source branch: $(git symbolic-ref --short HEAD) at $(git rev-parse --short HEAD)"
      - name: Mint the gate's throwaway seed identity
        run: |
          set -euo pipefail
          /usr/bin/python3 seed/seed.py keygen --out /root/.odile/seed-signing.pem --force
          /usr/bin/python3 seed/seed.py keygen --out /var/tmp/odile-ci-release-key.pem --force
          /usr/bin/python3 seed/seed.py seed-cert \
            --file /root/.odile/seed-signing.pem.pub \
            --key /var/tmp/odile-ci-release-key.pem \
            --out /var/tmp/odile-ci-seed.crt
      - name: make fresh-check
        env:
          ODILE_SEED_SIGNING_KEY: /root/.odile/seed-signing.pem
          ODILE_SEED_CERT: /var/tmp/odile-ci-seed.crt
          ODILE_SEED_RELEASE_PUBKEY: /var/tmp/odile-ci-release-key.pem.pub
        run: make fresh-check

  demo-check:
    name: demo-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96
    steps:
      - name: Install git, python3 and make
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -y -qq git python3 ca-certificates make
          echo "demo-check host: $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release) | $(python3 --version)"
      - name: Check out the tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # The checkout is written by the runner's user and read by root inside the
      # container, which git refuses as "dubious ownership" without this.
      - name: Trust this checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: make demo-check
        run: make demo-check

  publish-lint:
    name: publish-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96
    steps:
      - name: Install git and python3
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -y -qq git python3 ca-certificates
          echo "publish-lint host: $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release) | $(python3 --version)"
      - name: Check out the tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # The checkout is written by the runner's user and read by root inside the
      # container, which git refuses as "dubious ownership" without this.
      - name: Trust this checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The gate must not run the scanner it is gating — on a pull request.
      # A PR that weakens tools/leak_scan.py or widens leak-allow.tsv would
      # otherwise pass its own gate: the job used to execute both files out of
      # the PR's checkout. So on `pull_request` the step below fetches the base
      # branch and runs ITS scanner with ITS allowlist over this tree. The
      # workspace is ephemeral and the job pushes nothing, so copying the base
      # allowlist over the checkout changes no published byte. A PR that needs a
      # new allowlist row (class, credential, reason and expiry) therefore
      # cannot grant it to itself; a maintainer lands the row on main first.
      #
      # A push to main is not a pull request. The pushed tree IS main, already
      # gated against its base, so running the pre-push main's scanner and
      # allowlist here made every landing push red on main's own head: the rows
      # the merged tree needs are exactly the ones its base lacks. Measured on
      # ODL-911 (2026-11-20): the base's allowlist reported 178 tree findings
      # on the merged head that the tree's own allowlist pins. So on a push the
      # tree's own scanner and allowlist run — the last step below — and the
      # base pair is the pull-request gate only.
      #
      # The deny list is the repository's `LEAK_FORBID_B64` secret, so neither
      # the PR nor the base carries it in the checkout: it is installed at
      # `docs/ops/leak-forbid.txt` (the one documented path) before either scan,
      # and a job without the secret says so rather than passing silently. The
      # job is read-only: it opens no PR and pushes nothing.
      - name: Install the deny list from the repository secret
        env:
          LEAK_FORBID_B64: ${{ secrets.LEAK_FORBID_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${LEAK_FORBID_B64:-}" ]; then
            echo "forbid list: absent (no LEAK_FORBID_B64 repository secret)"
            echo "forbid list: the forbidden-value and forbidden-path classes are off in this run"
            exit 0
          fi
          mkdir -p docs/ops
          printf '%s' "$LEAK_FORBID_B64" | base64 -d > docs/ops/leak-forbid.txt
          labels=$(grep -c -v -e '^#' -e '^[[:space:]]*$' docs/ops/leak-forbid.txt || true)
          echo "forbid list: docs/ops/leak-forbid.txt from LEAK_FORBID_B64 (${labels} rows)"
          test "$labels" -gt 0
      - name: Gate the tree with the base branch's scanner, not the PR's
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The checkout is depth 1 and the PR's own tree is already the
          # working tree, so only the base's files have to be fetched.
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base_sha=$(git rev-parse FETCH_HEAD)
          echo "base: pull_request at $base_sha"
          git show "$base_sha:tools/leak_scan.py" > /tmp/base-leak_scan.py
          git show "$base_sha:leak-allow.tsv" > /tmp/base-leak-allow.tsv
          cp leak-allow.tsv /tmp/pr-leak-allow.tsv
          # `set -e` aborts on the scan's non-zero exit, so the restore is a
          # trap: a plain `cp` after the scan would be skipped on the red path.
          trap 'cp /tmp/pr-leak-allow.tsv leak-allow.tsv' EXIT
          cp /tmp/base-leak-allow.tsv leak-allow.tsv
          # The base scanner's default is the documented path too, but name it:
          # a flag makes a list that vanished between steps exit 2, not skip.
          if [ -f docs/ops/leak-forbid.txt ]; then
            /usr/bin/python3 /tmp/base-leak_scan.py --tree --root "$PWD" \
              --forbid-file docs/ops/leak-forbid.txt
          else
            echo "forbid list: absent (the forbidden-value and forbidden-path classes are off in this tree)"
            /usr/bin/python3 /tmp/base-leak_scan.py --tree --root "$PWD"
          fi
      # On a push to main this is the whole gate: the tree's own scanner with
      # the tree's own allowlist, over the merged result the push lands.
      - name: Scan the tree with its own deny list
        run: |
          set -euo pipefail
          if [ -f docs/ops/leak-forbid.txt ]; then
            /usr/bin/python3 tools/leak_scan.py --tree \
              --forbid-file docs/ops/leak-forbid.txt
          else
            echo "forbid list: absent (the forbidden-value and forbidden-path classes are off in this tree)"
            /usr/bin/python3 tools/leak_scan.py --tree
          fi

  history-secrets:
    name: history-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96
    steps:
      - name: Install git and python3
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -y -qq git python3 ca-certificates
          echo "history host: $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release) | $(python3 --version)"
      # actions/checkout defaults to depth 1; on a one-commit clone the history
      # scan reads one commit and prints PASS, which is worse than no gate. The
      # full history is the subject of this job.
      - name: Check out the full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # The checkout is written by the runner's user and read by root inside the
      # container, which git refuses as "dubious ownership" without this.
      - name: Trust this checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prove the clone is not shallow
        run: |
          set -euo pipefail
          shallow=$(git rev-parse --is-shallow-repository)
          echo "is-shallow-repository: $shallow"
          test "$shallow" = "false"
      - name: Scan every commit and assert the scanned count
        run: |
          set -euo pipefail
          report=/tmp/secret-scan.txt
          /usr/bin/python3 tools/secret_scan.py --history | tee "$report"
          scanned=$(sed -n 's/^  commits scanned: \([0-9][0-9,]*\) (git rev-list --all)$/\1/p' "$report" | tr -d ',')
          expected=$(git rev-list --count --all)
          echo "scanned ${scanned} commits; git rev-list --count --all = ${expected}"
          test -n "$scanned"
          test "$scanned" -eq "$expected"
          echo "scanned ${scanned} commits; matches git rev-list --count --all"
      # The deny list over history. Same event rule as `publish-lint`: on a
      # pull request the BASE branch's scanner and allowlist run, because the
      # gate must not run the files it is gating. This step used to run the PR
      # checkout's own scanner and allowlist, so a branch could add a literal in
      # one commit and delete it in the next (a clean tree) and waive its own
      # history finding with one appended allowlist row — the "a commit that is
      # later deleted" surface in docs/ops/LEAK-CONTROL.md, which is the case
      # this job exists for. The workspace is ephemeral and the job pushes
      # nothing, so copying the base files over the checkout changes no
      # published byte; the PR's allowlist is restored afterwards, through an
      # `EXIT` trap so the red path restores it too.
      #
      # A push to main runs the tree's own scanner and allowlist: main is the
      # merged result, already gated as a pull request, and the allowlist rows a
      # merge adds are exactly the rows its base lacks. On ODL-911 (2026-11-20)
      # the base's allowlist reported 3,643 findings over the merged head's
      # blobs that the tree's own allowlist pins.
      #
      # The list itself is the repository's `LEAK_FORBID_B64` secret, installed
      # at `docs/ops/leak-forbid.txt` by the step above: it is neither the PR's
      # nor the base's file, so a branch can no more waiver it than it can
      # waiver the scanner. A run without the secret prints `forbid list absent`
      # and skips, rather than passing as if the class had run.
      #
      # The class is scoped (--forbid-only): the roots this repository replaced
      # already published addresses and home paths, and a job about the deny list
      # must not fail on a class its predecessor's history settled. Every blob in
      # rev-list --all is read, so a literal in a commit that HEAD no longer
      # carries is still a red run. The list's own path is skipped by the
      # scanner — including the root copy this branch carried in its early
      # commits and removed at b7b75b2, which stays in history (ODL-910 cuts
      # history; ODL-911 is forward-only).
      - name: Install the deny list from the repository secret
        env:
          LEAK_FORBID_B64: ${{ secrets.LEAK_FORBID_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${LEAK_FORBID_B64:-}" ]; then
            echo "forbid list: absent (no LEAK_FORBID_B64 repository secret)"
            echo "forbid list: the forbidden-value and forbidden-path classes are off in this run"
            exit 0
          fi
          mkdir -p docs/ops
          printf '%s' "$LEAK_FORBID_B64" | base64 -d > docs/ops/leak-forbid.txt
          labels=$(grep -c -v -e '^#' -e '^[[:space:]]*$' docs/ops/leak-forbid.txt || true)
          echo "forbid list: docs/ops/leak-forbid.txt from LEAK_FORBID_B64 (${labels} rows)"
          test "$labels" -gt 0
      - name: Gate every blob with the base branch's scanner, not the PR's
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Full history is already here (fetch-depth 0), so the base is a
          # plain fetch: a --depth=1 fetch would graft a shallow boundary
          # onto this clone and quietly shorten rev-list --all.
          git fetch --no-tags origin "$BASE_REF"
          base_sha=$(git rev-parse FETCH_HEAD)
          echo "base: pull_request at $base_sha"
          if [ ! -f docs/ops/leak-forbid.txt ]; then
            echo "forbid list: absent (the forbidden-value and forbidden-path classes are off in this run)"
            exit 0
          fi
          git show "$base_sha:tools/leak_scan.py" > /tmp/base-leak_scan.py
          git show "$base_sha:leak-allow.tsv" > /tmp/base-leak-allow.tsv
          cp leak-allow.tsv /tmp/pr-leak-allow.tsv
          # `set -e` aborts on the scan's non-zero exit, so the restore is a
          # trap: a plain `cp` after the scan would be skipped on the red path.
          trap 'cp /tmp/pr-leak-allow.tsv leak-allow.tsv' EXIT
          cp /tmp/base-leak-allow.tsv leak-allow.tsv
          # `--forbid-only` landed with the list, so a base that predates this
          # branch has a scanner that rejects the flag. Fall back to the tree's
          # scanner for that one transition run (the pull request that lands the
          # flag), with a line saying so; every later run reads the base's.
          scanner=/tmp/base-leak_scan.py
          if ! /usr/bin/python3 "$scanner" --help 2>&1 | grep -q -- "--forbid-only"; then
            echo "base scanner predates --forbid-only; this run uses the tree's scanner"
            scanner=tools/leak_scan.py
          fi
          /usr/bin/python3 "$scanner" --history \
            --forbid-file docs/ops/leak-forbid.txt --forbid-only
      # On a push to main this is the whole history gate: the tree's own
      # scanner, allowlist and the secret's list, over the history the push
      # lands.
      - name: Gate every blob with the tree's own deny list
        run: |
          set -euo pipefail
          if [ ! -f docs/ops/leak-forbid.txt ]; then
            echo "forbid list: absent (the forbidden-value and forbidden-path classes are off in this run)"
            exit 0
          fi
          /usr/bin/python3 tools/leak_scan.py --history \
            --forbid-file docs/ops/leak-forbid.txt --forbid-only
      # The repository is the source of truth: one root, cut once from `main`
      # `65e2764` (`24ee323`), and every commit after it is ordinary work on
      # top — a card's branch included, merged with --no-ff. On a push to main
      # the assertion is the root count and the head: exactly one root and the
      # head is the pushed sha. A second root or a stale head is a red run; a
      # merge commit is not (ODL-910 retired the zero-merge rule). (A pull
      # request is a branch, so its own commits are what the scan above reads.)
      - name: On a push to main, assert the history shape
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # The first commit is a cut of the tree, and every commit after it is
          # ordinary work on top. So: exactly one root, and the head is what was
          # pushed. Merge commits are allowed: a card branch reaches main by a
          # --no-ff merge, and the repository is the source of truth for both.
          roots=$(git rev-list --max-parents=0 origin/main | wc -l | tr -d ' ')
          count=$(git rev-list --count origin/main)
          echo "commits=${count} roots=${roots} head=$(git rev-parse --short origin/main)"
          test "$roots" -eq 1
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          echo "one root, head is the pushed commit"
