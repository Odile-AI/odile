name: Bug report
description: Something in Odile is wrong, and you can say what.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The smallest sequence you know that shows it.
      placeholder: |
        1. Ran `make demo`
        2. Clicked Artifacts → Files
        3. The file list is empty
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The command you ran and what it printed, pasted as text.
      render: console
  - type: markdown
    attributes:
      value: |
        A live vulnerability goes to security@odile.fyi, not here — see SECURITY.md.
