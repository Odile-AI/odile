# odilectl config — copy to /root/.odile/config.yaml and chmod 0600.
#
# The CLI refuses a file that is group- or world-readable. The four credential
# groups are the reseller key, the DNS token, the mail relay key and the paths
# below. Values may contain ':' and '#'; a line starting with '#' is a comment.
provider: servury
reseller_key: REPLACE_ME
dns_token: REPLACE_ME
relay_key: REPLACE_ME
state_db: /var/lib/odile/waitlist.db
seed_db: /var/lib/odile/waitlist.db
backup_repo: sftp://backup@example.invalid/odile
support_public_key: /etc/odile/support/odile-support.pub
default_plan_id: 113
default_days: 31

# The account site the invitation email names. When set, the recovery kit
# prints <host>/forgot instead of pointing at the invitation email; a pasted
# <host>/forgot is accepted and stripped. Keep the value alone on the line: an
# inline `#` comment would land in the value (the loader keeps `#`). Uncomment
# on a host whose account site answers /forgot (ODL-578 ships that route).
# account_host: https://odile.fyi
