# odilectl config — copy to /root/.odile/config.yaml and chmod 0600.
#
# The CLI refuses a file that is group- or world-readable. The four credential
# groups are the reseller key, the DNS token, the mail relay key and the paths
# below. Values may contain ':' and '#'; a line starting with '#' is a comment.
provider: servury
reseller_key: REPLACE_ME
dns_token: REPLACE_ME
relay_key: REPLACE_ME
state_db: /var/lib/odile/waitlist.db
seed_db: /var/lib/odile/waitlist.db
backup_repo: sftp://backup@example.invalid/odile
support_public_key: /etc/odile/support/odile-support.pub
# The provisioning defaults: a Blackbox Nano at the annual term — plan 138 is
# the Canada tier (1 vCPU / 2 GB / 25 GB), 139 the Netherlands and 141 the US.
# The tier is not a preference: Servury cannot downgrade a machine, so a plan
# larger than the Nano cannot come back without a rebuild. See
# docs/runbooks/deploy.md's config table and docs/evidence/nano-baseline.md.
default_plan_id: 138
default_days: 365
default_vcpus: 1

# Every instance's inference runs on its own NEAR AI key (ODL-242). The mint
# needs the account's management credential: a rotating session credential,
# 0600, never the inference key. `near_account` is the switch — without it no
# key is minted and the seed carries the config's shared key (the manual/bench
# path). `near_spend_limit_usd` is the per-key cap passed at mint (A2's
# envelope: $10). `seed_keys` is the handoff file `odilectl provision` writes
# the raw key into and the seed service consumes; it must match the service's
# ODILE_SEED_KEYS (default /var/lib/odile/seed-keys.json).
# near_account: /root/.odile/near-account.json
# near_workspace_id: 00000000-0000-0000-0000-000000000000
# near_org_id: 00000000-0000-0000-0000-000000000000
# near_spend_limit_usd: 10
# seed_keys: /var/lib/odile/seed-keys.json

# The account site the invitation email names. When set, the recovery kit
# prints <host>/forgot instead of pointing at the invitation email; a pasted
# <host>/forgot is accepted and stripped. Keep the value alone on the line: an
# inline `#` comment would land in the value (the loader keeps `#`). Uncomment
# on a host whose account site answers /forgot (ODL-578 ships that route).
# account_host: https://odile.fyi
